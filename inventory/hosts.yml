---
# Example inventory. Replace placeholder hostnames + IPs with your own.
#
# Top-level groups:
#   alpine             — every alpine host
#   desktops           — workstations/laptops
#   servers            — anything headless
#     wireguard_servers
#     cdn (parent of cdn_edges, cdn_varnish)
#     docker_hosts (parent of docker_standalone, docker_swarm/{managers,workers})

all:
  children:
    alpine:
      children:
        desktops:
          hosts:
            desktop1:
              ansible_host: 10.0.0.2     # the host's wg IP
        servers:
          children:
            observability:
              hosts: {}
              # obs1: { ansible_host: 10.0.0.40 }
            wireguard_servers:
              hosts:
                hub:
                  ansible_host: HUB_PUBLIC_IP
            cdn:
              children:
                cdn_edges:
                  hosts: {}
                cdn_varnish:
                  hosts: {}
            docker_hosts:
              children:
                docker_standalone:
                  hosts: {}
                  # nas:    { ansible_host: 10.0.0.50 }
                docker_swarm:
                  children:
                    docker_managers:
                      hosts: {}
                      # pi-mgr-1: { ansible_host: 10.0.0.60 }
                      # pi-mgr-2: { ansible_host: 10.0.0.61 }
                    docker_workers:
                      hosts: {}
                      # pi-wk-1:  { ansible_host: 10.0.0.70 }
                      # pi-wk-2:  { ansible_host: 10.0.0.71 }
                      # pi-wk-3:  { ansible_host: 10.0.0.72 }
