---
# Local 3-VM PoC. Adjust ansible_host to whatever IPs your bridge
# (libvirt default 192.168.122.0/24, or whatever you set up) hands out.
#
# Run with:  ansible-playbook -i inventory/poc playbooks/cdn-poc.yml

all:
  children:
    poc:
      vars:
        ansible_user: root
      children:
        cdn_edges:
          hosts:
            edge:
              ansible_host: 192.168.122.10
        cdn_varnish:
          hosts:
            varnish:
              ansible_host: 192.168.122.20
        cdn_origins:
          hosts:
            origin:
              ansible_host: 192.168.122.30
