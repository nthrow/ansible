---
- name: Alpine desktop
  hosts: desktops
  gather_facts: true
  become: false   # we already log in as root via bootstrap-installed key
  roles:
    # Cross-applicable (server + desktop):
    - common
    - zfs
    - dmcrypt
    # users runs before grub_efi because it renders /etc/fstab (with the
    # LABEL=efi entry) and grub_efi later does `mount /efi`.
    - users
    - sshd
    - firewall
    - grub_efi
    - secureboot
    - firmware_update

    # Desktop-only:
    - networking_desktop
    # Cross-DE prep — fonts + udev + elogind + acpid + udisks2 + tlp +
    # mesa + vulkan + xdg-portal core + base apps.  Always runs.
    - desktop_base
    # Both DE roles are always *included*; the per-DE install task is
    # gated by `desktop_environment` inside the role.  This lets the
    # uninstall tags (`--tags uninstall_kde` / `--tags uninstall_gnome`)
    # fire even after you've flipped `desktop_environment` to the
    # other DE — the gate is install-only, not role-inclusion-level.
    # Default behavior unchanged: only the matching DE's install runs.
    - desktop_kde
    - desktop_gnome
    - dev_stack
    - flatpak

    # Observability agent (last so daemons it talks to are up).
    - monitoring_agent
