# redefine control key
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# use UTF8
#set -g utf8
#set-window-option -g utf8 on
bind r source-file ~/.tmux.conf \; display "Fully Loaded!"

# bump scrollback buffer
set -g history-limit 250000

# define window split keys
bind | split-window -h
bind - split-window -v

# keyboard select/copy/paste
set-window-option -g mode-keys vi
#bind-key -t vi-copy 'v' begin-selection
#bind-key -t vi-copy 'y' copy-selection

# quick pane change
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# quick pane move
bind-key T swap-window -t 0
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# setup Status Line
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"

set -g automatic-rename on
set -g status-interval 1

# default status bar colors
set-option -g status-style bg=colour235,fg=colour11

# Default window title colors
set-window-option -g window-status-style fg=colour240,dim

# Active window title colors
set-window-option -g window-status-current-style fg=colour10,bg=colour235,dim

# clock
set-window-option -g status-right " %H:%M %d-%b-%y "
set-window-option -g status-right-style fg=colour166

# message text
set-option -g message-style bg=colour235,fg=colour7

# esc delay driving me bonkers
set -sg escape-time 0

# default session name
new-session -s PAD

## END ##
