---
# Two paths:
#   - default run: install cross-DE desktop base
#   - --tags uninstall_desktop_base: tear it down (after first removing
#     the per-DE bits via --tags uninstall_kde / uninstall_gnome)
#
# Like the per-DE roles, the `never` tag on the uninstall path means
# it's skipped by default; you have to explicitly opt in.

- name: Install desktop_base
  ansible.builtin.include_tasks: install.yml
  tags: [install]

- name: Uninstall desktop_base
  ansible.builtin.include_tasks:
    file: uninstall.yml
    # `apply` propagates the tag to the included tasks too; without it,
    # only the include itself matches `--tags uninstall_desktop_base`
    # and the children are silently filtered out (same pattern as the
    # per-DE roles).
    apply:
      tags: [uninstall_desktop_base]
  tags: [uninstall_desktop_base, never]
