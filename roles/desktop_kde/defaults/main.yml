---
# KDE-specific configuration.  Cross-DE bits (elogind, eudev, acpid,
# udisks2, tlp, mesa, vulkan, fonts, xdg-desktop-portal core, firefox,
# etc.) live in `desktop_base`.

sddm_theme: breeze
sddm_cursor_theme: breeze_cursors

# KDE Plasma + sddm + KDE-only apps and integration bits.  If a
# package is also useful in GNOME, move it to desktop_base.
kde_packages:
  # Display manager.
  - sddm
  - sddm-openrc
  - sddm-breeze
  - sddm-kcm
  # Plasma desktop core.
  - plasma-desktop
  - plasma-browser-integration
  - plasma-disks
  - plasma-firewall
  - plasma-nm
  - plasma-pa
  - plasma-systemmonitor
  - plasma-thunderbolt
  - plasma-vault
  - plasma-workspace-wallpapers
  - kdeplasma-addons
  - powerdevil           # KDE's power-management daemon
  - print-manager
  - systemsettings
  # KDE apps.
  - ark
  - audiocd-kio
  - dolphin
  - ffmpegthumbs
  - gwenview
  - kate
  - kde-cli-tools
  - kde-gtk-config
  - kdenetwork-filesharing
  - kdialog
  - kfind
  - kinfocenter
  - kio-extras
  - kio-fuse
  - kmenuedit
  - kolourpaint
  - konsole
  - kscreen
  - ksshaskpass
  - kunifiedpush
  - kwallet-pam
  - kwrite
  - okular
  - spectacle
  - totem
  # KDE Bluetooth integration (uses libbluedevil + breeze-icons —
  # reverse-deps that previously held breeze-icons during uninstall
  # because bluedevil wasn't listed here).
  - bluedevil
  # Integration: portal backend, polkit auth UI, OSK, theming.
  - breeze
  - breeze-gtk
  - breeze-icons
  - maliit-keyboard
  - polkit-kde-agent-1
  - xdg-desktop-portal-kde
  - pinentry-qt
