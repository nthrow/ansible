---
# `rc-service sddm restart` doesn't work under Alpine's supervise-daemon
# wrapper: the stop step is a no-op while the supervisor stays alive, then
# start fails with "already running".  Instead, signal the sddm child by
# exact comm match — the supervisor catches the exit and respawns sddm,
# which re-reads /etc/sddm.conf at startup.  `-x sddm` is critical:
# without it, `supervise-daemon sddm ...` (cmdline) would also match.
- name: restart sddm
  ansible.builtin.command: pkill -TERM -x sddm
  changed_when: true
  failed_when: false  # no-op if sddm wasn't running; supervisor will start it
