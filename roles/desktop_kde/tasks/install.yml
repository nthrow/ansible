---
# KDE-specific install + sddm.  Cross-DE prep (udev/elogind/acpid/
# udisks2/tlp/fonts/portal-core) ran in `desktop_base`.

- name: Install KDE Plasma + apps
  community.general.apk:
    name: "{{ kde_packages }}"
    state: present

- name: SDDM theme + greeter override
  ansible.builtin.template:
    src: sddm.conf.j2
    dest: /etc/sddm.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart sddm

- name: Stat sddm init script
  ansible.builtin.stat:
    path: /etc/init.d/sddm
  register: _kde_sddm_init

- name: Enable sddm (default runlevel)
  ansible.builtin.service:
    name: sddm
    enabled: true
    runlevel: default
  when: _kde_sddm_init.stat.exists

# `state: started` via ansible.builtin.service uses openrc's status check,
# which can disagree with the underlying supervise-daemon (openrc reports
# "stopped" while supervise-daemon has sddm running).  ansible then asks
# rc-service to start, supervise-daemon refuses with "already running",
# rc-service exits non-zero, ansible reports failed.  Workaround: call
# rc-service ourselves and treat "already running" as non-failure.
- name: Ensure sddm is started (tolerant of supervise-daemon already-running)
  ansible.builtin.command: rc-service sddm start
  register: _kde_sddm_start
  changed_when: "'already running' not in _kde_sddm_start.stdout + _kde_sddm_start.stderr"
  failed_when:
    - _kde_sddm_start.rc != 0
    - "'already running' not in _kde_sddm_start.stdout + _kde_sddm_start.stderr"
  when: _kde_sddm_init.stat.exists

# ---- default terminal: ghostty -----------------------------------
# KDE reads system-wide defaults from /etc/xdg/.  Setting
# TerminalApplication in kdeglobals there makes ghostty the default
# for any user on a fresh install (overridable via per-user
# ~/.config/kdeglobals).
- name: Default terminal application = ghostty (system kdeglobals)
  community.general.ini_file:
    path: /etc/xdg/kdeglobals
    section: General
    option: TerminalApplication
    value: ghostty
    owner: root
    group: root
    mode: "0644"
    create: true
