---
# Two paths:
#   - default run: install KDE + sddm if desktop_environment == "kde"
#   - --tags uninstall_kde: tear down KDE regardless of desktop_environment
#
# The `never` tag on the uninstall path means it's skipped by default;
# you have to explicitly opt in.  The desktop_environment gate is on
# install only, so you can `--tags uninstall_kde` AFTER flipping the
# var to "gnome" and the uninstall still fires.

- name: Install KDE
  ansible.builtin.include_tasks: install.yml
  when: desktop_environment == "kde"
  tags: [install]

- name: Uninstall KDE
  ansible.builtin.include_tasks:
    file: uninstall.yml
    # `apply` propagates the tag to the included tasks too; without it,
    # only the include itself matches `--tags uninstall_kde` and the
    # children are silently filtered out.
    apply:
      tags: [uninstall_kde]
  tags: [uninstall_kde, never]
