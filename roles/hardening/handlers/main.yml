---
- name: restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted

- name: reload sysctl
  # Alpine's busybox sysctl doesn't have GNU `--system`.  Apply just
  # the hardening file we templated; other sysctl.d/ files are already
  # in effect from boot.
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-hardening.conf
  changed_when: true

- name: restart sshguard
  ansible.builtin.service:
    name: sshguard
    state: restarted
