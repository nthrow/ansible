---
# Portable user-account + doas management. The desktop-only fstab
# rendering (with bootstrap.sh's ZFS/LUKS/EFI assumptions) is gated on
# `users_manage_fstab` (default false; flipped to true in
# group_vars/desktops.yml).

- name: Install doas
  community.general.apk:
    name: doas
    state: present

- name: Install user shell (when one is configured)
  community.general.apk:
    name: "{{ desktop_user_shell | basename }}"
    state: present
  when: desktop_user is defined and desktop_user_shell is defined

- name: Ensure auxiliary groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ desktop_user_groups | default([]) }}"
  when: desktop_user is defined

- name: Create desktop user
  ansible.builtin.user:
    name: "{{ desktop_user }}"
    shell: "{{ desktop_user_shell | default(omit) }}"
    groups: "{{ desktop_user_groups | default([]) | join(',') }}"
    append: false
    create_home: true
    # '*' = no valid password but account NOT locked. Without this,
    # ansible.builtin.user creates the account with shadow password
    # '!' (locked), which makes sshd reject pubkey auth with
    # "User <name> not allowed because account is locked", and SDDM
    # likewise refuses to authenticate the session.
    password: "*"
    state: present
  when: desktop_user is defined

- name: Ensure desktop user .ssh exists
  ansible.builtin.file:
    path: "/home/{{ desktop_user }}/.ssh"
    state: directory
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0700"
  when: desktop_user is defined

# Inherit root's authorized_keys (populated by bootstrap.sh) so whoever
# ran the install can ssh in as alice without a separate key roundtrip.
# Override by setting `desktop_user_authorized_keys: []` to skip the
# inherit, or to a list of keys to install those instead of root's.
- name: Install authorized_keys for desktop user (inherit from root)
  ansible.builtin.copy:
    src: /root/.ssh/authorized_keys
    remote_src: true
    dest: "/home/{{ desktop_user }}/.ssh/authorized_keys"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0600"
  when:
    - desktop_user is defined
    - desktop_user_authorized_keys is not defined

- name: Install authorized_keys for desktop user (explicit list)
  ansible.posix.authorized_key:
    user: "{{ desktop_user }}"
    key: "{{ item }}"
    state: present
    exclusive: "{{ ansible_loop.first }}"
  loop: "{{ desktop_user_authorized_keys | default([]) }}"
  loop_control:
    extended: true
  when:
    - desktop_user is defined
    - desktop_user_authorized_keys is defined
    - desktop_user_authorized_keys | length > 0

# Alpine ships opendoas 6.8.2 which advertises drop-in support
# (`/etc/doas.d/*.conf`) in the default doas.conf comments, but the
# `include` directive itself is not actually parsed in this build —
# `doas -C` fails with "syntax error at line 6". We just write the
# rule into /etc/doas.conf directly.
- name: Configure doas (wheel persist)
  ansible.builtin.copy:
    dest: /etc/doas.conf
    content: "permit persist :wheel\n"
    owner: root
    group: root
    mode: "0400"

# --- desktop-only: /opt bind-mount backing tree + fstab ----------
- name: Create /opt/<user> backing tree for noexec /home bind mounts
  ansible.builtin.file:
    path: "/opt/{{ desktop_user }}/{{ item }}"
    state: directory
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0755"
  loop: "{{ home_bind_mounts | default([]) }}"
  when:
    - users_manage_fstab | default(false)
    - desktop_user is defined
    - home_bind_mounts is defined

- name: Render /etc/fstab (bare-metal-bootstrap layout)
  ansible.builtin.template:
    src: fstab.j2
    dest: /etc/fstab
    owner: root
    group: root
    mode: "0644"
  when: users_manage_fstab | default(false)

# --- desktop user dotfiles -----------------------------------------
# Personal terminal + multiplexer config.  Same set on every desktop
# host so the user gets their normal environment immediately on a
# fresh install.  Gated on `desktop_user` being defined so server
# hosts don't get these.
- name: Deploy ~/.tmux.conf for desktop user
  # Propagates the canonical /root/.tmux.conf (placed by the common
  # role) so the desktop user gets the same config without duplicating
  # the source file in two role file dirs.
  ansible.builtin.copy:
    src: /root/.tmux.conf
    remote_src: true
    dest: "/home/{{ desktop_user }}/.tmux.conf"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0644"
  when: desktop_user is defined

- name: Ensure ~/.config/ghostty exists for desktop user
  ansible.builtin.file:
    path: "/home/{{ desktop_user }}/.config/ghostty"
    state: directory
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0755"
  when: desktop_user is defined

- name: Deploy ~/.config/ghostty/config for desktop user
  ansible.builtin.copy:
    src: dot.config-ghostty-config
    dest: "/home/{{ desktop_user }}/.config/ghostty/config"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0644"
  when: desktop_user is defined
